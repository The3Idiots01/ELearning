spring.application.name=ELearningBE

# Database Configuration (Neon PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-aged-butterfly-azybdc8f.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# Hikari Connection Pool Settings for Neon Pooler
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Hibernate & JPA Configuration
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
