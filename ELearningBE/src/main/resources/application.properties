spring.application.name=ELearningBE
server.port=8080

# Database Configuration (Neon PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-aged-butterfly-azybdc8f.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# Hikari Connection Pool Settings for Neon Pooler
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-migration-patterns=*:missing,*:future,*:mismatched


# Redis Configuration (Redis Cloud)
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:redis-19655.crce302.ap-seast-1-3.ec2.cloud.redislabs.com}
spring.data.redis.port=${REDIS_PORT:19655}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000ms

# SendGrid Configuration
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
jwt.confirmation-token-expiration-ms=${JWT_CONFIRMATION_TOKEN_EXPIRATION_MS:900000}

# Storage Configuration (provider=local for dev, s3 for Cloudflare R2 in prod)

learnova.storage.provider=${STORAGE_PROVIDER:local}
learnova.storage.upload-ttl=15m
learnova.storage.download-ttl=15m
learnova.storage.local.root-dir=${STORAGE_LOCAL_ROOT_DIR:./storage-data}
learnova.storage.local.public-base-url=${STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080}
learnova.storage.local.signing-secret=${STORAGE_LOCAL_SIGNING_SECRET:learnova-local-storage-dev-secret-change-me}
# Cloudflare R2 (S3-compatible) — điền khi provider=s3 (Task 6)
learnova.storage.s3.endpoint=${R2_ENDPOINT:}
learnova.storage.s3.region=${R2_REGION:auto}
learnova.storage.s3.bucket=${R2_BUCKET:}
learnova.storage.s3.access-key=${R2_ACCESS_KEY:}
learnova.storage.s3.secret-key=${R2_SECRET_KEY:}
learnova.storage.s3.public-base-url=${R2_PUBLIC_BASE_URL:}

# Course Publish thresholds (kiểu Udemy — chỉnh được khi demo)
learnova.course.publish.min-description-length=200
learnova.course.publish.min-objectives=4
learnova.course.publish.min-requirements=1
learnova.course.publish.min-audiences=1

# Application URLs Configuration (Flexible for Hosting & Production)
# If APP_BASE_URL is not set, backend automatically resolves domain name from incoming HTTP request
app.base-url=${APP_BASE_URL:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# Jackson Configuration
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false

